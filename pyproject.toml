[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-tracker"
version = "1.0.0"
description = "Production-oriented financial tracker REST API and analytics project"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Roman Mariana" },
]
keywords = ["finance", "fastapi", "sqlite", "laboratory", "analytics"]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
finance-tracker = "finance_tracker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/benchmark_lab09.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["finance_tracker"]
omit = [
    "src/finance_tracker/main.py",
    "src/finance_tracker/benchmark.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
