[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-tracker"
version = "0.1.0"
description = "Financial tracker laboratory project"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
finance-tracker = "finance_tracker.main:main"

[tool.setuptools.packages.find]
where = ["src"]
